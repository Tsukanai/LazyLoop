<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Type K Thermocouple | LazyLoop</title>

        <script src="../theme.js"></script>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <main class="container">

        <a class="back-link" href="thermocouple.html">
            ‹ Thermocouple
        </a>

        <header class="main-header">
            <h1>Thermocouple (K)</h1>
            <p>EMF ⇄ Temperature</p>
        </header>


        <section class="calculator-card">

            <div class="standard-info">
                <strong>Type K · ITS-90</strong><br>
                NIST reference function
            </div>


            <h2>Cold Junction / Reference</h2>

            <div class="value-input">

                <input
                    id="coldJunction"
                    type="number"
                    value="0"
                    step="any"
                    inputmode="decimal"
                        data-signed
                >

                <span>°C</span>

            </div>


            <div class="divider"></div>


            <div class="conversion">

                <div>

                    <label>Thermocouple EMF</label>

                    <div class="value-input">

                        <input
                            id="emf"
                            type="number"
                            value="4.096"
                            step="any"
                            inputmode="decimal"
                        data-signed
                        >

                        <span>mV</span>

                    </div>

                </div>


                <div class="conversion-arrow">
                    ⇄
                </div>


                <div>

                    <label>Hot Junction</label>

                    <div class="value-input">

                        <input
                            id="temperature"
                            type="number"
                            value="100"
                            step="any"
                            inputmode="decimal"
                        data-signed
                        >

                        <span>°C</span>

                    </div>

                </div>

            </div>


            <div class="pt100-reference">

                <div class="reference-item">

                    <span class="reference-temperature">
                        Cold Junction
                    </span>

                    <span
                        id="cjcDisplay"
                        class="reference-resistance"
                    >
                        0 °C
                    </span>

                </div>


                <div class="reference-item">

                    <span class="reference-temperature">
                        Hot Junction
                    </span>

                    <span
                        id="hotDisplay"
                        class="reference-resistance"
                    >
                        100 °C
                    </span>

                </div>


                <div class="reference-item">

                    <span class="reference-temperature">
                        Measured EMF
                    </span>

                    <span
                        id="emfDisplay"
                        class="reference-resistance"
                    >
                        4.096 mV
                    </span>

                </div>

            </div>


            <div class="tc-materials" aria-label="Thermocouple conductor materials">
                <h2>Conductor materials</h2>
                <div class="tc-materials-grid">
                    <div>
                        <span class="tc-material-label">Positive (+)</span>
                        <strong>Chromel</strong>
                    </div>
                    <div>
                        <span class="tc-material-label">Negative (−)</span>
                        <strong>Alumel</strong>
                    </div>
                </div>
            </div>

            <p class="range-note">
                Type K ITS-90 · −270 to +1372 °C
            </p>

        </section>

    </main>


    <script src="type-k.js"></script>

</body>

</html>
